<!DOCTYPE html>
<html>
<head>
    <title>注册</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <a href="{{ back_url }}" class="back-btn">返回</a>
        <a href="{{ url_for('routes.home') }}" class="home-btn">首页</a>
        <h1>注册</h1>
        <form method="POST" action="{{ url_for('routes.register') }}">
            {{ form.hidden_tag() }}
            <label>用户名</label>
            {{ form.username }}
            <label>邮箱</label>
            {{ form.email }}
            <label>密码</label>
            {{ form.password }}
            <label>确认密码</label>
            {{ form.password2 }}
            <label>身份</label>
            {{ form.role }}
            {{ form.submit }}
        </form>
        <a href="{{ url_for('routes.login') }}">已有账号？去登录</a>
    </div>
</body>
</html>
