<!-- templates/teacher/dashboard.html -->
<!DOCTYPE html>
<html>
<head>
    <title>教师主页</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .welcome-message {
            text-align: center;
            margin-bottom: 40px;
            font-size: 18px;
        }
        .teacher-name {
            font-weight: bold;
        }
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .feature-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .feature-icon {
            font-size: 36px;
            margin-bottom: 15px;
        }
        .feature-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .feature-description {
            text-align: center;
            color: #666;
            margin-bottom: 15px;
        }
        .feature-link {
            display: inline-block;
            padding: 8px 16px;
            background-color: #4285f4;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .feature-link:hover {
            background-color: #3367d6;
        }
        .logout-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #dc3545;
            text-decoration: none;
        }
        .logout-link:hover {
            text-decoration: underline;
        }
        .flash-message {
            padding: 10px;
            background-color: #d4edda;
            color: #155724;
            border-radius: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>教师主页</h1>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <div class="welcome-message">
            欢迎回来，<span class="teacher-name">{{ current_user.full_name or current_user.username }}</span>！
        </div>
        
        <div class="feature-grid">
            <div class="feature-card">
                <div class="feature-icon">👨‍🎓</div>
                <div class="feature-title">管理学生</div>
                <div class="feature-description">
                    查看学生列表、个人档案，添加学习笔记和评价。
                </div>
                <a href="{{ url_for('teacher.student_list') }}" class="feature-link">查看学生</a>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">📝</div>
                <div class="feature-title">我的资料</div>
                <div class="feature-description">
                    查看和编辑个人资料信息，更新联系方式。
                </div>
                <a href="{{ url_for('teacher.teacher_profile') }}" class="feature-link">个人资料</a>
               
            </div>
        </div>
        
        <a href="{{ url_for('auth.logout') }}" class="logout-link">退出登录</a>
    </div>
</body>
</html>
