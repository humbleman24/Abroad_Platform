<!DOCTYPE html>
<html>
<head>
    <title>上传文件</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
 prophecies        <a href="{{ back_url }}" class="back-btn">返回</a>
        <a href="{{ url_for('routes.home') }}" class="home-btn">首页</a>
        <h1>上传文件</h1>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="modal" id="flashModal" style="display: block;">
                    <div class="modal-content">
                        {% for message in messages %}
                            <p>{{ message }}</p>
                        {% endfor %}
                        <button onclick="closeModal()">确定</button>
                    </div>
                </div>
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="{{ url_for('routes.upload') }}" enctype="multipart/form-data">
            {{ form.hidden_tag() }}
            <label>文件</label>
            {{ form.file }}
            <label>类别</label>
            {{ form.category }}
            {{ form.submit }}
        </form>
        
        <a href="{{ url_for('routes.documents') }}" class="btn">查看已上传文件</a>
    </div>

    <script>
        function closeModal() {
            document.getElementById('flashModal').style.display = 'none';
        }
    </script>
</body>
</html>
