<!DOCTYPE html>
<html>
<head>
    <title>登录</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <a href="{{ back_url }}" class="back-btn">返回</a>
        <a href="{{ url_for('routes.home') }}" class="home-btn">首页</a>
        <h1>登录</h1>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p class="flash-message">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('routes.login') }}">
            {{ form.hidden_tag() }}
            <label>用户名</label>
            {{ form.username }}
            <label>密码</label>
            {{ form.password }}
            {{ form.submit }}
        </form>
        <a href="{{ url_for('routes.register') }}">还没有账号？去注册</a>
    </div>
</body>
</html>
