{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>编辑笔记</h2>
    
    <!-- 添加一个专门的消息显示区域 -->
    <div id="message-container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
    
    <form action="{{ url_for('teacher.edit_note', note_id=note.id) }}" method="post">
        <div class="form-group mb-3">
            <label for="content">笔记内容</label>
            <textarea class="form-control" id="content" name="content" rows="5" required>{{ note.content }}</textarea>
        </div>
        
        <div class="form-group mb-3">
            <label for="note_type">笔记类型</label>
            <select class="form-control" id="note_type" name="note_type" required>
                <option value="timeline" {% if note.note_type == 'timeline' %}selected{% endif %}>申请时间线</option>
                <option value="completed" {% if note.note_type == 'completed' %}selected{% endif %}>已完成工作</option>
                <option value="todo" {% if note.note_type == 'todo' %}selected{% endif %}>待办事项</option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary">保存修改</button>
        <a href="{{ url_for('teacher.student_profile', student_id=note.student_id) }}" class="btn btn-secondary">取消</a>
    </form>
</div>

<script>
    // 自动隐藏消息
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            const messageContainer = document.getElementById('message-container');
            if (messageContainer) {
                messageContainer.style.display = 'none';
            }
        }, 3000); // 3秒后消失
    });
</script>
{% endblock %}
