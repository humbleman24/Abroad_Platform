<!DOCTYPE html>
<html>
<head>
    <title>已上传文件</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <a href="{{ back_url }}" class="back-btn">返回</a>
        <a href="{{ url_for('routes.home') }}" class="home-btn">首页</a>
        <h1>已上传文件</h1>
        
        <form method="GET" action="{{ url_for('routes.documents') }}">
            <label>筛选类别</label>
            <select name="category">
                <option value="">全部</option>
                <option value="简历" {% if category == '简历' %}selected{% endif %}>简历</option>
                <option value="申请信" {% if category == '申请信' %}selected{% endif %}>申请信</option>
                <option value="推荐信" {% if category == '推荐信' %}selected{% endif %}>推荐信</option>
            </select>
            <button type="submit">筛选</button>
        </form>
        
        <ul>
            {% for doc in documents %}
                <li>
                    <a href="{{ url_for('routes.download_file', filename=doc.filename) }}" target="_blank">
                        {{ doc.category }}: {{ doc.filename }}
                    </a>
                    <button class="delete-btn" onclick="showDeleteModal('{{ doc.filename }}')">删除</button>
                </li>
            {% else %}
                <li>暂无文件</li>
            {% endfor %}
        </ul>
    </div>

    <div class="modal" id="deleteModal" style="display: none;">
        <div class="modal-content">
            <p id="deleteMessage">是否确认删除该文件？</p>
            <button onclick="confirmDelete()">是</button>
            <button onclick="closeDeleteModal()">否</button>
        </div>
    </div>

    <script>
        let fileToDelete = null;

        function showDeleteModal(filename) {
            fileToDelete = filename;
            document.getElementById('deleteMessage').textContent = `是否确认删除文件：${filename}？`;
            document.getElementById('deleteModal').style.display = 'block';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
            fileToDelete = null;
        }

        function confirmDelete() {
            if (fileToDelete) {
                window.location.href = `/delete/${fileToDelete}`;
            }
        }
    </script>
</body>
</html>
